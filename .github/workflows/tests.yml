name: Tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  schema-preprocessing:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (generated-model tests import it)
        run: pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

  model-drift:
    name: Generated models match the pinned UCP spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read lockfile provenance
        id: lock
        run: |
          set -euo pipefail
          read -r UCP_SHA UCP_SCHEMA_VERSION < <(python3 - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path("ucp-lock.json").read_text(encoding="utf-8"))
          print(lock["ucp_sha"], lock["ucp_schema_version"])
          PY
          )
          echo "ucp_sha=${UCP_SHA}" >> "$GITHUB_OUTPUT"
          echo "ucp_schema_version=${UCP_SCHEMA_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Install ucp-schema CLI
        env:
          UCP_SCHEMA_VERSION: ${{ steps.lock.outputs.ucp_schema_version }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          base_url="https://github.com/Universal-Commerce-Protocol/ucp-schema/releases/download/v${UCP_SCHEMA_VERSION}"
          curl -fsSL --retry 3 -o "$tmp_dir/ucp-schema-linux-x86_64" "${base_url}/ucp-schema-linux-x86_64"
          curl -fsSL --retry 3 -o "$tmp_dir/SHA256SUMS" "${base_url}/SHA256SUMS"
          (cd "$tmp_dir" && sha256sum -c --ignore-missing SHA256SUMS)
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$tmp_dir/ucp-schema-linux-x86_64" "$HOME/.local/bin/ucp-schema"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Checkout pinned UCP spec and regenerate models from ucp-lock.json
        env:
          UCP_SHA: ${{ steps.lock.outputs.ucp_sha }}
        run: |
          set -euo pipefail
          rm -rf .ucp-spec
          trap 'rm -rf .ucp-spec' EXIT
          git clone https://github.com/Universal-Commerce-Protocol/ucp .ucp-spec
          git -C .ucp-spec checkout --detach "$UCP_SHA"
          ./generate_models.sh --from-lock --spec-dir .ucp-spec
      - name: Fail if regeneration does not reproduce the committed models
        run: |
          git add -A -- src/ucp_sdk/models/schemas ucp-lock.json
          if ! git diff --cached --quiet -- src/ucp_sdk/models/schemas ucp-lock.json; then
            echo "::error::Committed models differ from regeneration against ucp-lock.json. Run ./generate_models.sh --from-lock and commit the result."
            git --no-pager diff --cached --stat -- src/ucp_sdk/models/schemas ucp-lock.json
            git --no-pager diff --cached -- src/ucp_sdk/models/schemas ucp-lock.json
            exit 1
          fi
          echo "Committed models match regeneration."
