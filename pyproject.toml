[project]
name = "ucp-sdk"
version = "0.6.0"
description = "UCP Python SDK"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    { name = "Enric Cusell", email = "cusell@google.com" },
    { name = "Federico D'Amato", email = "damaz@google.com" }
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "email-validator>=2.0.0",
]

[dependency-groups]
dev = [
    # Exact pins: the model-drift CI job regenerates the models against the
    # pinned UCP spec and asserts byte-identical output, so the codegen
    # toolchain must resolve reproducibly. Bump these pins and regenerate
    # the models in the same PR.
    "datamodel-code-generator[http]==0.81.0",
    "ruff==0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ucp_sdk"]

[tool.datamodel-codegen]
custom-file-header = """
# Copyright 2026 UCP Authors
#
# Licensed under the Apache License, Version 2.0 (the "License");
# you may not use this file except in compliance with the License.
# You may obtain a copy of the License at
#
#     http://www.apache.org/licenses/LICENSE-2.0
#
# Unless required by applicable law or agreed to in writing, software
# distributed under the License is distributed on an "AS IS" BASIS,
# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
# See the License for the specific language governing permissions and
# limitations under the License.

# generated by datamodel-codegen
# pylint: disable=all
# pyformat: disable
# mypy: disable-error-code="assignment"
# pyright: reportIncompatibleVariableOverride=false, reportGeneralTypeIssues=false
"""

[tool.ruff]
line-length = 80
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"src/ucp_sdk/models/schemas/**/*.py" = ["E501", "D", "N801", "N815"]
"postprocess_models.py" = ["E501", "D"]
"tests/**/*.py" = ["E501", "D"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "SIM", "N", "UP", "D", "PTH", "T20"]
ignore = ["D212", "D200"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
case-sensitive = true

[tool.pyright]
include = ["src/ucp_sdk", "tests/test_models.py"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/ucp_sdk", "tests/test_models.py"]
cache_dir = "/tmp/ucp_sdk_mypy_cache"

[[tool.mypy.overrides]]
module = ["postprocess_models", "tests.test_codegen_pipeline", "test_codegen_pipeline"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
warn_return_any = false
disable_error_code = ["var-annotated", "type-arg", "arg-type", "call-arg", "attr-defined", "union-attr", "index", "operator", "annotation-unchecked"]

[tool.pytest.ini_options]
pythonpath = ["."]
cache_dir = "/tmp/ucp_sdk_pytest_cache"
